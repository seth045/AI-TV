:root{--gold:#ffe0a2;--amber:#e9a34a;--red:#a5281c;--bg:#080b13;--bd:rgba(245,185,116,.28);--glass:rgba(31,17,21,.88)}*{box-sizing:border-box}

.home{max-width:1920px;margin:0 auto;position:relative;aspect-ratio:1648/928;isolation:isolate;overflow:hidden;background:#080b13}.home-picture{display:block;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}.home-shadow{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 24px #0008}

.home-note{position:absolute;bottom:1.15%;left:50%;transform:translateX(-50%);font-size:clamp(7px,.65vw,11px);letter-spacing:.1em;color:#f7e6c8bb;text-shadow:0 0 6px #000;background:#071021a8;padding:5px 12px;border-radius:30px;white-space:nowrap;z-index:2}
.snow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:40}.flake{position:absolute;top:-4vh;left:var(--x);color:#edf4ff;opacity:var(--a);font-size:var(--size);animation:fall var(--duration) linear infinite;animation-delay:var(--delay);text-shadow:0 0 5px #fff7}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(85deg)}}

function clock(){const d=new Date();$('#hclock').textContent=d.toLocaleTimeString([],prefs.clock24?{hour:'2-digit',minute:'2-digit',hour12:false}:{hour:'numeric',minute:'2-digit'});$('#hdate').textContent=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}setInterval(clock,15000);clock();
function snow(){const el=$('#snow');el.innerHTML='';for(let i=0;i<45;i++){let n=document.createElement('span');n.className='flake';n.textContent=i%3===0?'✧':'•';n.style.setProperty('--x',(Math.random()*100).toFixed(1)+'%');n.style.setProperty('--duration',(8+Math.random()*18).toFixed(1)+'s');n.style.setProperty('--delay',(-Math.random()*26).toFixed(1)+'s');n.style.setProperty('--size',(7+Math.random()*11).toFixed(0)+'px');n.style.setProperty('--a',(.2+Math.random()*.65).toFixed(2));n.style.setProperty('--drift',(-80+Math.random()*160).toFixed(0)+'px');el.append(n)}el.hidden=!prefs.snow}snow();
function glow(){document.documentElement.style.setProperty('--gold',prefs.glow?'#ffe0a2':'#b7eaff');document.documentElement.style.setProperty('--amber',prefs.glow?'#e9a34a':'#79b8ef')}
function toast(message){const t=$('#toast');t.textContent=message;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2400)}
function open(content){stopTimer();state.focusBefore=document.activeElement;$('#overlay').hidden=false;$('#modal-body').innerHTML=content;document.body.style.overflow='hidden';setTimeout(()=>$('#modal .close')?.focus(),10)}
function close(){stopTimer();$('#overlay').hidden=true;document.body.style.overflow='';if(state.focusBefore?.isConnected)state.focusBefore.focus()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(name,filter='All'){close();state.view=name;state.filter=filter;$('#home').hidden=name!=='Home';$('#view').hidden=name==='Home';if(name==='Home'){window.scrollTo(0,0);return}renderView();window.scrollTo(0,0)}
function renderView(){const v=state.view;const names=['Home','Movies','Shows','Live TV','Apps','My List'];$('#navlinks').innerHTML=names.map(n=>`<button data-nav="${n}" class="${n===v?'active':''}">${n}</button>`).join('');const copy={'Movies':['Christmas Movies','A little cinematic magic for every holiday movie night.'],'Shows':['Winter Shows','The cozy series and family favorites collection.'],'Live TV':['Live TV & Ambience','Explore demonstration channels and relaxing scenes.'],'Apps':['Your Apps','All your streaming apps in one festive place.'],'My List':['My Holiday List','Your favorite Christmas movies and shows.']};$('#view-title').textContent=copy[v]?.[0]||v;$('#view-sub').textContent=copy[v]?.[1]||'';$('#filters').hidden=v==='Apps'||v==='My List';$('#filters').innerHTML=categories.map(cat=>`<button class="filter ${cat===state.filter?'active':''}" data-filter="${cat}">${cat}</button>`).join('');$('#grid').className=v==='Apps'?'app-grid':'movie-grid';let items=movies.filter(m=>v==='Movies'?m.type==='Movie':v==='Shows'?m.type==='Show':v==='Live TV'?m.type==='Channel':v==='My List'?favorites.includes(m.id):true);if(state.filter!=='All'&&!['Apps','My List'].includes(v))items=items.filter(m=>m.genre===state.filter);$('#grid-title').textContent=v==='Apps'?'Choose an app':v==='Live TV'?'Live-style previews':v==='My List'?'Saved favorites':'Featured for you';$('#item-count').textContent=(v==='Apps'?providers.length:items.length)+' available';
if(v==='Apps'){$('#grid').innerHTML=providers.map(p=>`<button class="provider" data-provider="${p.id}"><span class="mark" style="color:${p.color}">${esc(p.symbol)}</span><small>${esc(p.name)} →</small></button>`).join('');return}
$('#grid').innerHTML=items.length?items.map(m=>`<button class="movie-tile" data-movie="${m.id}"><div class="movie-thumb" style="--c:${m.color};${m.poster?`background-image:url('${m.poster}')`:''}">${m.poster?'':`<span class="emoji">${m.emoji}</span><strong>${esc(m.title)}</strong>`}</div><div class="movie-details"><b>${esc(m.title)}</b><small>${esc(m.genre)} · ${m.length} min${m.type==='Channel'?' · Demo channel':''}</small><div class="progress"><i style="width:${progress[m.id]||0}%"></i></div></div></button>`).join(''):'<div class="empty">No titles in this category yet. Try another category or add a favorite. 🎄</div>'}
function showMovie(id){const m=movies.find(x=>x.id===Number(id));if(!m)return;state.movie=m;const isfav=favorites.includes(m.id);open(`<div class="kicker">${m.type} · ${m.genre} · ${m.length} min</div><h2>${esc(m.title)}</h2>${m.poster?`<img class="poster-large" src="${m.poster}" alt="${esc(m.title)} festive concept artwork"/>`:`<div class="player-screen" style="height:160px;background:radial-gradient(ellipse at 70% 25%,${m.color},#09101b)"><span class="snow-emoji">${m.emoji}</span></div>`}<p>${esc(m.description)}</p><p class="subtle">${progress[m.id]||0}% watched · Interactive demo title · No copyrighted video is streamed</p><div class="actions"><button class="btn" data-action="play">▶ ${progress[m.id]>0?'Resume':'Play'} Preview</button><button class="btn alt" data-action="favorite">${isfav?'✓ Remove from My List':'☆ Add to My List'}</button><button class="btn alt" data-action="close">Back</button></div>`)}
function openApp(id){const p=providers.find(x=>x.id===id);if(!p)return;open(`<div class="kicker">APP LAUNCHER · CHRISTMAS EDITION</div><div style="font-size:74px;font-weight:800;margin:22px 0;color:${p.color};text-shadow:0 3px 15px #000">${p.symbol}</div><h2>${esc(p.name)}</h2><p>Your home screen is themed; actual ${esc(p.name)} streaming and authentication happen on the official website or TV app.</p><div class="actions"><button class="btn" data-external="${p.id}">↗ Open ${esc(p.name)}</button><button class="btn alt" data-action="browse">Browse Demo Movies</button></div>`)}
function favorite(){if(!state.movie)return;let id=state.movie.id;if(favorites.includes(id)){favorites=favorites.filter(x=>x!==id);toast('Removed from My List')}else{favorites.push(id);toast('Added to My List ★')}save('favorites',favorites);showMovie(id);if(state.view==='My List')renderView()}
function stopTimer(){if(state.interval){clearInterval(state.interval);state.interval=null}state.playing=false}
function play(){if(!state.movie)return;const m=state.movie;open(`<div class="kicker">HOLIDAY TV · SIMULATED PLAYER</div><h2 style="font-size:34px">Now Playing: ${esc(m.title)}</h2><div class="player-screen"><div class="snow-emoji">${m.emoji}</div><strong>${esc(m.title)}</strong><div class="subtle">❄ Winter magic, on your screen ❄</div></div><div class="player-progress" id="player-progress" role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="100" tabindex="0"><i id="progress-fill"></i></div><div class="player-status"><span id="elapsed">00:00</span><span>90-second simulated demo</span></div><div class="actions"><button class="btn alt" data-action="back10">↶ 10 sec</button><button class="btn" data-action="toggle" id="togglePlay">❚❚ Pause</button><button class="btn alt" data-action="next10">10 sec ↷</button><button class="btn alt" data-action="backMovie">✕ Close Player</button></div><p class="subtle">Player controls and watch progress work. This is a simulated preview, not a licensed movie stream.</p>`);state.pos=progress[m.id]||0;state.playing=true;updatePlayer();state.interval=setInterval(()=>{if(!state.playing)return;state.pos=Math.min(100,state.pos+100/90);progress[m.id]=Math.round(state.pos);save('progress',progress);updatePlayer();if(state.pos>=100){state.playing=false;toast('Preview finished')}} ,1000)}
function updatePlayer(){if(!$('#progress-fill'))return;$('#progress-fill').style.width=state.pos+'%';let sec=Math.round(state.pos*.9);$('#elapsed').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('#togglePlay').textContent=state.playing?'❚❚ Pause':'▶ Play';$('#player-progress').setAttribute('aria-valuenow',String(Math.round(state.pos)))}
function search(){open(`<div class="kicker">DISCOVER SOMETHING WONDERFUL</div><h2>Search Holiday TV</h2><input class="search-input" id="query" type="search" placeholder="Search movies, shows, apps…" aria-label="Search movies, shows and apps" autocomplete="off"/><div class="results" id="results"></div>`);drawResults('');$('#query').focus()}
function drawResults(query){const q=query.toLowerCase().trim();const found=[...movies.filter(m=>m.title.toLowerCase().includes(q)||m.genre.toLowerCase().includes(q)).map(m=>({name:m.title,subtitle:`${m.type} · ${m.genre}`,icon:m.emoji,key:'data-movie',id:m.id})),...providers.filter(p=>p.name.toLowerCase().includes(q)).map(p=>({name:p.name,subtitle:'Streaming app',icon:'📺',key:'data-provider',id:p.id}))];$('#results').innerHTML=found.length?found.map(x=>`<button class="result" ${x.key}="${x.id}"><span><b>${x.icon} ${esc(x.name)}</b><small>${esc(x.subtitle)}</small></span>→</button>`).join(''):'<p>No matches. Try “Elf”, “Family”, or “Hulu”.</p>'}
function settings(){let opts=[['snow','Animated snowfall','Real animated flakes over your TV screen'],['glow','Warm golden lighting','Switch gold accents to icy-blue highlights'],['clock24','24-hour clock','Show the time in 24-hour format']];open(`<div class="kicker">MAKE IT YOUR OWN</div><h2>Christmas Settings</h2><p>Personalize your TV. Changes are saved automatically in this browser.</p>${opts.map(o=>`<div class="setting"><div><b>${o[1]}</b><small>${o[2]}</small></div><button role="switch" aria-checked="${!!prefs[o[0]]}" aria-label="${o[1]}" data-setting="${o[0]}" class="switch ${prefs[o[0]]?'on':''}"></button></div>`).join('')}<div class="actions"><button class="btn alt" data-action="fullscreen">⛶ Fullscreen</button><button class="btn alt" data-action="reset">↻ Reset my demo</button></div>`)}
function profiles(){open(`<div class="kicker">WHO’S WATCHING?</div><h2>Choose a Profile</h2><div class="profile-list">${[['🎅','Santa'],['🙂','Guest'],['🦌','Rudolph']].map(p=>`<button class="profile" data-profile="${p[1]}"><span>${p[0]}</span>${p[1]}</button>`).join('')}</div>`)}
function full(){if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>toast('Fullscreen is unavailable here'))}}
function action(name){switch(name){case'close':close();break;case'search':search();break;case'settings':settings();break;case'profiles':profiles();break;case'browse':nav('Movies');break;case'favorite':favorite();break;case'play':play();break;case'toggle':state.playing=!state.playing;updatePlayer();break;case'back10':state.pos=Math.max(0,state.pos-11);updatePlayer();break;case'next10':state.pos=Math.min(100,state.pos+11);updatePlayer();break;case'backMovie':showMovie(state.movie?.id);break;case'fullscreen':full();break;case'reset':if(confirm('Reset watch progress, saved movies, and settings?')){try{for(const k of ['prefs','favorites','progress'])localStorage.removeItem('holiday_cine_'+k)}catch(e){}location.reload()}break;}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav],[data-action],[data-movie],[data-provider],[data-category],[data-filter],[data-setting],[data-profile],[data-external]');if(!t){if(e.target===$('#overlay'))close();return}let d=t.dataset;if(d.nav)nav(d.nav);else if(d.action)action(d.action);else if(d.movie)showMovie(d.movie);else if(d.provider)openApp(d.provider);else if(d.category)nav('Movies',d.category);else if(d.filter){state.filter=d.filter;renderView()}else if(d.setting){prefs[d.setting]=!prefs[d.setting];save('prefs',prefs);t.classList.toggle('on',prefs[d.setting]);t.setAttribute('aria-checked',String(prefs[d.setting]));snow();glow();clock();toast('Theme setting saved')}else if(d.profile){toast('Watching as '+d.profile+' 🎄');close()}else if(d.external){let p=providers.find(x=>x.id===d.external);if(p)window.open(p.url,'_blank','noopener,noreferrer')}});
document.addEventListener('input',e=>{if(e.target.id==='query')drawResults(e.target.value)});
document.addEventListener('click',e=>{if(e.target.id==='player-progress'){const r=e.target.getBoundingClientRect();state.pos=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));updatePlayer();progress[state.movie.id]=Math.round(state.pos);save('progress',progress)}});
document.addEventListener('keydown',e=>{let typing=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);if(e.key==='Escape'){if(!$('#overlay').hidden)close();else nav('Home');e.preventDefault();return}if(typing)return;if(e.key==='/'){search();e.preventDefault();return}if(e.key.toLowerCase()==='f'&&!e.altKey&&!e.ctrlKey){full();e.preventDefault();return}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){const sel=!$('#overlay').hidden?'#overlay button:not([disabled]),#overlay input':'#app .home:not([hidden]) button,#app .view:not([hidden]) button';const btns=$$(sel).filter(x=>x.getClientRects().length);if(!btns.length)return;const from=btns.includes(document.activeElement)?document.activeElement:null;const a=from?.getBoundingClientRect();const px=a?a.x+a.width/2:(e.key==='ArrowLeft'||e.key==='ArrowUp'?innerWidth:0),py=a?a.y+a.height/2:0;const vertical=e.key==='ArrowUp'||e.key==='ArrowDown';const sg=e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1;let winner=null,best=Infinity;for(const b of btns){if(b===from)continue;const r=b.getBoundingClientRect(),x=r.x+r.width/2-px,y=r.y+r.height/2-py;const primary=vertical?y:x,secondary=vertical?x:y;if(primary*sg<=2)continue;const score=Math.abs(primary)+Math.abs(secondary)*1.8;if(score<best){best=score;winner=b}}(winner||btns[0]).focus();e.preventDefault()}});
$('#overlay').addEventListener('keydown',e=>{if(e.key==='Tab'){const btns=$$('#overlay button,#overlay input').filter(b=>b.getClientRects().length);let first=btns[0],last=btns[btns.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
glow();
})();
</script><script>
/* AI-TV native adapter: launch real installed apps from the cinematic home,
   wire the remote Back button, and give the D-pad a starting focus. */
(function(){
  var CAND={netflix:['com.netflix.ninja'],disney:['com.disney.disneyplus'],
    max:['com.wbd.stream','com.hbo.hbonow','com.hbo.hbomax'],
    prime:['com.amazon.amazonvideo.livingroom','com.amazon.avod.thirdpartyclient'],
    youtube:['com.google.android.youtube.tv','com.google.android.youtube'],
    hulu:['com.hulu.plus','com.hulu.livingroomplus'],
    apple:['com.apple.atve.androidtv.appletv']};
  var KW={netflix:'netflix',disney:'disney',max:'max',prime:'prime',youtube:'youtube',hulu:'hulu',apple:'apple'};
  var installed=null;
  function apps(){ if(installed)return installed; try{installed=JSON.parse(AndroidTV.listApps());}catch(e){installed=[];} return installed; }
  function launchId(id){
    if(!(window.AndroidTV&&AndroidTV.launch))return false;
    var c=CAND[id]||[],i; for(i=0;i<c.length;i++){ try{ if(AndroidTV.launch(c[i]))return true; }catch(e){} }
    var kw=KW[id]; if(kw){ var a=apps(),j; for(j=0;j<a.length;j++){ if((a[j].label||'').toLowerCase().indexOf(kw)>=0){ try{ if(AndroidTV.launch(a[j].package))return true; }catch(e){} } } }
    return false;
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('[data-provider],[data-external]'); if(!t)return;
    var id=t.getAttribute('data-provider')||t.getAttribute('data-external');
    if(window.AndroidTV&&AndroidTV.launch){ if(launchId(id)){ e.stopImmediatePropagation(); e.preventDefault(); } }
  },true);
  window.AITV_LAUNCHER={ onBack:function(){
      var ov=document.getElementById('overlay'); if(ov&&!ov.hidden){ var c=ov.querySelector('[data-action=close]'); if(c)c.click(); return; }
      var v=document.getElementById('view'); if(v&&!v.hidden){ var h=document.querySelector('[data-nav=Home]'); if(h)h.click(); }
    }, refresh:function(){ installed=null; } };
  setTimeout(function(){ var f=document.querySelector('.hit.app-hit'); if(f&&f.focus) f.focus(); },300);
})();
</script>
