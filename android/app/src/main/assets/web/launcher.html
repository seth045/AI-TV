<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-TV</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<main id="stage" aria-label="Home screen">
  <img id="bg" alt="" draggable="false">
  <script>
    // Start fetching the wallpaper before the launcher script is parsed.
    (function () {
      var id = 'christmas';
      try { var t = JSON.parse(localStorage.getItem('aitv_theme')); if (typeof t === 'string' && /^[a-z0-9_-]{1,32}$/.test(t)) id = t; } catch (e) {}
      document.getElementById('bg').src = 'themes/' + id + '/home.webp';
    })();
  </script>
  <img id="bg2" alt="" draggable="false">
  <div id="fxdom" aria-hidden="true"></div>
  <div id="shade" aria-hidden="true"></div>

  <button id="gear" data-f aria-label="Settings and themes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3h0a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9v0a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
  </button>
  <div id="clock" aria-hidden="true"><div id="time"></div><div id="date"></div></div>

  <div id="grid" role="list" aria-label="Your apps"><div id="tiles"></div></div>
  <div id="track" aria-hidden="true"><i></i></div>

  <div id="modals"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</main>
<script src="launcher.js"></script>
</body>
</html>
